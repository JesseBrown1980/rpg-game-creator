<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to RPG Game</title>
    <style media="screen">
      body {
        background: #1ABC9C;
        color: #FFFFFF;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #message {
        background: #16A085;
        max-width: 500px;
        text-align: center;
        padding: 30px;
        border-radius: 10px;
      }
      #message h1 {
        font-size: 30px;
        font-weight: bold;
        color: #FFFFFF;
      }
      #message p {
        margin: 20px 0;
        font-size: 18px;
        color: #ECF0F1;
      }
      #message a {
        display: inline-block;
        background: #E67E22;
        color: #FFFFFF;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 5px;
        transition: background 0.3s;
      }
      #message a:hover {
        background: #D35400;
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h1>Welcome to RPG Game</h1>
      <p>Your adventure starts here. Are you ready to create your own story?</p>
      <a href="/explore.html">Start Your Adventure</a>
    </div>
  </body>
</html>
